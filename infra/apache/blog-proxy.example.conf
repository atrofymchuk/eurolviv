# Example Apache config for production WordPress blog proxy.
# Place BEFORE SPA fallback rules.

<IfModule mod_proxy.c>
  ProxyPreserveHost On

  RedirectMatch 301 ^/blog$ /blog/

  ProxyPass        /blog/ http://127.0.0.1:8081/
  ProxyPassReverse /blog/ http://127.0.0.1:8081/
</IfModule>

# Ensure SPA fallback does NOT catch /blog/*
# Existing .htaccess should keep /blog excluded from RewriteRule to index.html
